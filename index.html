<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Control d'Accessos</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --occupied: #d97706;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --whatsapp: #22c55e;
      --exit: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

    #lockScreen {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .lock-box {
      width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    .lock-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .lock-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    .lock-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 18px; }
    .pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--primary); transition: 0.15s; }
    .pin-dot.filled { background: var(--primary); transform: scale(1.1); }
    .pin-dot.error { border-color: var(--danger); background: var(--danger); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .key-btn {
      background: var(--card-alt); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 15px 0; font-size: 1.25rem; font-weight: 700; cursor: pointer;
    }
    .key-btn:active { background: var(--primary); }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px var(--danger); transition: 0.3s; }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    h1 { font-size: 1.05rem; font-weight: 700; }
    .sub-status { font-size: 0.72rem; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .lang-switch { display: flex; background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
    .lang-btn { background: transparent; color: var(--muted); border: none; padding: 6px 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .lang-btn.active { background: var(--primary); color: #fff; }

    .container { max-width: 680px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    .card-title { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      border: none; border-radius: 10px; padding: 12px 14px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: transform 0.08s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    button:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-occupied { background: var(--occupied); color: #fff; }
    .btn-success { background: var(--success); color: #052e16; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: var(--warning); color: #451a03; }
    .btn-ghost { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-wa { background: var(--whatsapp); color: #052e16; font-weight: 700; }
    .btn-sm { padding: 9px 10px; font-size: 0.82rem; border-radius: 8px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    select, input {
      width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 12px; font-size: 0.95rem; outline: none;
    }

    /* Selector de dies de la setmana */
    .days-picker { display: none; margin-bottom: 12px; }
    .days-picker.show { display: block; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 4px; }
    .day-btn {
      padding: 9px 2px; font-size: 0.78rem; font-weight: 700; border-radius: 8px;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .day-btn.active { background: var(--primary); color: #fff; border-color: #60a5fa; }

    /* Targetes de Box / Gimnàs (2 per fila) */
    .box-item {
      background: var(--card-alt); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: 0.25s;
    }
    .box-item.occupied { border-color: var(--warning); background: rgba(245, 158, 11, 0.12); }
    .box-item.inside { border-color: var(--success); background: rgba(16, 185, 129, 0.14); }
    .box-item.locked { border-color: var(--danger); background: rgba(239, 68, 68, 0.12); }
    .box-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.95rem; gap: 6px; }
    .box-info {
      background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 8px; padding: 7px 8px; font-size: 0.76rem; color: var(--muted);
      display: flex; flex-direction: column; gap: 4px; min-height: 46px; justify-content: center;
    }
    .box-info-pin { color: #f8fafc; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .box-info-times { display: flex; justify-content: space-between; gap: 6px; font-variant-numeric: tabular-nums; }
    .time-in { color: #6ee7b7; font-weight: 600; }
    .time-out { color: #7dd3fc; font-weight: 600; }
    .box-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .badge { font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
    .badge-ok { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .badge-lock { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }
    .badge-pend { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }
    .badge-week { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }
    .badge-exit { background: rgba(56, 189, 248, 0.22); color: #7dd3fc; }

    .pin-card {
      background: var(--card-alt); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .pin-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pin-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.2rem; font-weight: 800; letter-spacing: 0.06em; color: #fff; }
    .pin-meta { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .pin-actions { display: flex; gap: 8px; margin-top: 2px; }
    .pin-actions button { flex: 1; }

    /* Pestanyes del registre */
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tab-btn {
      flex: 1; padding: 8px; font-size: 0.8rem; border-radius: 8px;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .log-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .io-row {
      background: var(--bg); padding: 9px 11px; border-radius: 9px;
      border-left: 4px solid var(--success); display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .io-row.out { border-left-color: var(--exit); }
    .io-main { display: flex; flex-direction: column; gap: 2px; }
    .io-title { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .io-sub { font-size: 0.74rem; color: var(--muted); }
    .io-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .io-time { font-size: 0.76rem; color: var(--muted); font-weight: 600; }

    .log-row { font-size: 0.78rem; background: var(--bg); padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--primary); display: flex; justify-content: space-between; gap: 8px; }
    .log-row.err { border-left-color: var(--danger); }
    .log-row.ok { border-left-color: var(--success); }

    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #020617; color: #fff; border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: 0.25s; z-index: 50;
    }
    .toast.show { opacity: 1; bottom: 26px; }
  </style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔐</div>
    <div class="lock-title" data-i18n="lockTitle">Accés Administrador</div>
    <div class="lock-sub" data-i18n="lockSub">Introdueix el PIN de gestió</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="keypad">
      <button class="key-btn" onclick="pressPin('1')">1</button>
      <button class="key-btn" onclick="pressPin('2')">2</button>
      <button class="key-btn" onclick="pressPin('3')">3</button>
      <button class="key-btn" onclick="pressPin('4')">4</button>
      <button class="key-btn" onclick="pressPin('5')">5</button>
      <button class="key-btn" onclick="pressPin('6')">6</button>
      <button class="key-btn" onclick="pressPin('7')">7</button>
      <button class="key-btn" onclick="pressPin('8')">8</button>
      <button class="key-btn" onclick="pressPin('9')">9</button>
      <button class="key-btn" onclick="clearAdminPin()" style="font-size:0.9rem; color:var(--muted);">C</button>
      <button class="key-btn" onclick="pressPin('0')">0</button>
      <button class="key-btn" onclick="delAdminPin()" style="font-size:1rem;">⌫</button>
    </div>
  </div>
</div>

<header>
  <div class="brand">
    <div id="connDot" class="dot"></div>
    <div>
      <h1 data-i18n="appTitle">Control d'Accessos</h1>
      <div id="connText" class="sub-status" data-i18n="connecting">Connectant a EMQX...</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="lang-switch">
      <button id="btnCa" class="lang-btn active" onclick="setLang('ca')">CA</button>
      <button id="btnEs" class="lang-btn" onclick="setLang('es')">ES</button>
    </div>
    <button class="btn-ghost btn-sm" onclick="lockApp()" title="Bloquejar pantalla">🔒</button>
  </div>
</header>

<div class="container">

  <!-- 1. GENERAR NOU ACCÉS O CLAUER -->
  <section class="card">
    <div class="card-title" data-i18n="newAccessTitle">Nou accés o clauer</div>
    <div class="form-row">
      <div>
        <label data-i18n="selectBox">Destí d'accés</label>
        <select id="selBox"></select>
      </div>
      <div>
        <label data-i18n="duration">Durada de l'accés</label>
        <select id="selDuration" onchange="onDurationChange()">
          <option value="60" data-i18n="dur1h">1 hora</option>
          <option value="120" data-i18n="dur2h">2 hores</option>
          <option value="240" data-i18n="dur4h">4 hores</option>
          <option value="480" data-i18n="dur8h">8 hores</option>
          <option value="1440" selected data-i18n="dur24h">24 hores (1 dia)</option>
          <option value="4320" data-i18n="dur3d">3 dies</option>
          <option value="10080" data-i18n="dur7d">7 dies</option>
          <option value="weekly" data-i18n="durWeekly">📅 Dies de la setmana (recurrent)</option>
          <option value="5256000" data-i18n="durPerm">Permanent (Clauer / Fix)</option>
        </select>
      </div>
    </div>

    <div id="daysPicker" class="days-picker">
      <label data-i18n="pickDaysLabel">Selecciona els dies autoritzats (24 h cada dia):</label>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="form-row">
      <div>
        <label data-i18n="clientLabel">Nom client / clauer (opcional)</label>
        <input id="inpNote" type="text" placeholder="Ex: Joan / Clauer Pedro" />
      </div>
      <div>
        <label data-i18n="pinLabel">Codi PIN o ID Clauer</label>
        <div style="display:flex; gap:6px;">
          <input id="inpPin" type="text" maxlength="10" inputmode="numeric" />
          <button type="button" class="btn-ghost btn-sm" onclick="genRandomPin()" title="Generar PIN">🎲</button>
        </div>
      </div>
    </div>
    <button class="btn-primary" style="width:100%; margin-top:4px;" onclick="crearAcceso()" data-i18n="btnCreateSync">
      Guardar i enviar al controlador
    </button>
  </section>

  <!-- 2. OBERTURA MANUAL, PRESÈNCIA EN VIU I BLOQUEJOS (2 PER FILA) -->
  <section class="card">
    <div class="card-title">
      <span data-i18n="remoteControl">Obertura remota i presència</span>
      <span id="sysLockBadge" class="badge badge-ok" data-i18n="sysActive">SISTEMA ACTIU</span>
    </div>
    <div class="grid-2" style="margin-bottom:12px;">
      <button class="btn-success" onclick="cmdAbrirPrincipal()" data-i18n="btnOpenMain">
        🚪 Obrir Porta Principal
      </button>
      <button id="btnSysLock" class="btn-danger" onclick="toggleSystemLock()" data-i18n="btnLockAll">
        🔒 Bloquejar TOT
      </button>
    </div>
    <div class="grid-2" id="boxesGrid"></div>
  </section>

  <!-- 3. REGISTRE VISUAL D'ENTRADES I SORTIDES + REGISTRE TÈCNIC -->
  <section class="card">
    <div class="card-title">
      <span data-i18n="liveEvents">Control d'entrades i sortides</span>
      <button class="btn-ghost btn-sm" onclick="clearLogs()" data-i18n="btnClear">Netejar</button>
    </div>
    <div class="tabs">
      <button id="tabIO" class="tab-btn active" onclick="setLogTab('io')" data-i18n="tabIO">🟢 Entrades / Sortides</button>
      <button id="tabTech" class="tab-btn" onclick="setLogTab('tech')" data-i18n="tabTech">⚙️ Registre tècnic</button>
    </div>
    <div id="ioList" class="log-list"></div>
    <div id="logList" class="log-list" style="display:none;"></div>
  </section>

  <!-- 4. CODIS I CLAUERS ACTIUS -->
  <section class="card">
    <div class="card-title">
      <span data-i18n="activePinsTitle">Codis i clauers actius</span>
      <div style="display:flex; gap:6px;">
        <button class="btn-ghost btn-sm" onclick="activarPortalWiFi()">📶 Wi-Fi</button>
        <button class="btn-ghost btn-sm" onclick="syncListaConESP32()" data-i18n="btnForceSync">↻ Reenviar</button>
      </div>
    </div>
    <div id="pinsList"></div>
  </section>

</div>

<div id="toast" class="toast"></div>

  function getDestinoNombre(boxNum) {
    if (boxNum === 0) return I18N[lang].mainDoorTag;

  function formatearDiasMask(mask, full = false) {
    const dict = full ? DAY_FULL[lang] : DAY_LABELS[lang];
    return DAY_ORDER.filter(d => (mask & (1 << d)) !== 0).map(d => dict[d]).join(", ");
  }

  function formatearDuracion(seg) {
    const mins = Math.round(seg / 60);
    if (mins < 60) return `${mins} min`;
    const horas = Math.floor(mins / 60);
    const remMins = mins % 60;
    if (horas < 24) return remMins > 0 ? `${horas}h ${remMins}m` : (horas === 1 ? "1 hora" : (lang === "ca" ? `${horas} hores` : `${horas} horas`));
    const dias = Math.round(horas / 24);
    return dias === 1 ? (lang === "ca" ? "1 dia" : "1 día") : (lang === "ca" ? `${dias} dies` : `${dias} días`);
  }

  function publicarEstadoNube() {
    if (!client || !client.connected) return;
    stateUpdatedAt = Date.now();
    localStorage.setItem("pwa_state_ts", String(stateUpdatedAt));
    client.publish(TOPIC_STATE, JSON.stringify({
      updatedAt: stateUpdatedAt, accesos, sistemaBloqueado, boxBloqueado, boxStats, ioLogs: ioLogs.slice(0, 30)
    }), { qos: 1, retain: true });
  }

  function aplicarEstadoNube(snapshot) {
    if (!snapshot || !Array.isArray(snapshot.accesos)) return;
    const remoteTs = Number(snapshot.updatedAt || 0);
    if (remoteTs > 0 && remoteTs === stateUpdatedAt) return;

    stateUpdatedAt = remoteTs || Date.now();
    accesos = snapshot.accesos;
    sistemaBloqueado = Boolean(snapshot.sistemaBloqueado);
    if (Array.isArray(snapshot.boxBloqueado)) {
      boxBloqueado = snapshot.boxBloqueado;
      while (boxBloqueado.length < 7) boxBloqueado.push(false);
    }
    if (snapshot.boxStats && typeof snapshot.boxStats === "object") {
      boxStats = snapshot.boxStats;
      localStorage.setItem("pwa_box_stats", JSON.stringify(boxStats));
    }
    if (Array.isArray(snapshot.ioLogs) && snapshot.ioLogs.length > 0) {
      ioLogs = snapshot.ioLogs;
      localStorage.setItem("pwa_io_logs", JSON.stringify(ioLogs));
    }

    localStorage.setItem("pwa_state_ts", String(stateUpdatedAt));
    saveState();
    renderPins();
    renderIOLogs();
  }

  function initMQTT() {
    const clientId = "PWA_Admin_" + Math.random().toString(16).substring(2, 8);
    client = mqtt.connect(BROKER_URL, {
      clientId, username: MQTT_USER, password: MQTT_PASS, reconnectPeriod: 3000, clean: true
    });

    client.on("connect", () => {
      document.getElementById("connDot").classList.add("online");
      document.getElementById("connText").textContent = I18N[lang].connected;
      client.subscribe(TOPIC_EVENTS);
      client.subscribe(TOPIC_STATE);
    });

    client.on("close", () => {
      document.getElementById("connDot").classList.remove("online");
      document.getElementById("connText").textContent = I18N[lang].disconnected;
    });

    client.on("message", (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        if (topic === TOPIC_STATE) aplicarEstadoNube(data);
        else if (topic === TOPIC_EVENTS) procesarEventoESP32(data);
      } catch (e) { console.error(e); }
    });
  }

  function publishCmd(obj) {
    if (!client || !client.connected) { showToast("MQTT offline"); return false; }
    client.publish(TOPIC_CMD, JSON.stringify(obj), { qos: 1 });
    return true;
  }

  function procesarEventoESP32(ev) {
    const ahoraSec = Math.floor(Date.now() / 1000);
    const hora = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const horaFull = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const fechaCorta = new Date().toLocaleDateString(lang === "ca" ? "ca-ES" : "es-ES", { day: "2-digit", month: "2-digit" });
    const pinStr = String(ev.detalle || "").trim();
    const boxNum = Number(ev.box || 0);

    if ((ev.tipo === "entrada" || ev.tipo === "salida") && pinStr) {
      let acc = accesos.find(a => String(a.pin) === pinStr);
      let nombre = acc && acc.nota ? acc.nota : `PIN ${pinStr}`;
      let estanciaTxt = "";

      if (acc) {
        if (ev.tipo === "entrada") {
          acc.dentro = true;
          acc.horaEntrada = hora;
          acc.tsEntrada = ahoraSec;
          if (ev.primerUso && !acc.usado) {
            acc.usado = true;
            if (!acc.diasMask) {
              acc.inicio = ahoraSec;
              acc.fin = ev.fin ? Number(ev.fin) : (ahoraSec + (acc.duracion || 86400));
            }
          }
        } else {
          if (acc.tsEntrada && ahoraSec > acc.tsEntrada) {
            estanciaTxt = formatearDuracion(ahoraSec - acc.tsEntrada);
          }
          acc.dentro = false;
          acc.horaSalida = hora;
          acc.tsEntrada = 0;
        }
      }

      if (boxNum >= 1 && boxNum <= 6) {
        const prev = boxStats[boxNum] || {};
        if (ev.tipo === "entrada") {
          boxStats[boxNum] = {
            pin: pinStr,
            nombre: acc && acc.nota ? acc.nota : "",
            entrada: hora,
            salida: "",
            dentro: true
          };
        } else {
          boxStats[boxNum] = {
            pin: pinStr,
            nombre: acc && acc.nota ? acc.nota : (prev.nombre || ""),
            entrada: (prev.pin === pinStr && prev.entrada) ? prev.entrada : "—",
            salida: hora,
            dentro: false
          };
        }
        localStorage.setItem("pwa_box_stats", JSON.stringify(boxStats));
      }

      ioLogs.unshift({
        tipo: ev.tipo,
        nombre,
        pin: pinStr,
        box: boxNum,
        hora: `${fechaCorta} ${hora}`,
        estancia: estanciaTxt
      });
      if (ioLogs.length > 40) ioLogs.pop();
      localStorage.setItem("pwa_io_logs", JSON.stringify(ioLogs));

      saveState();
      renderPins();
      renderIOLogs();
      publicarEstadoNube();
    }

    if (ev.tipo === "reset_medianoche") {
      accesos.forEach(a => { a.dentro = false; a.tsEntrada = 0; });
      Object.keys(boxStats).forEach(k => { if (boxStats[k]) boxStats[k].dentro = false; });
      localStorage.setItem("pwa_box_stats", JSON.stringify(boxStats));
      saveState();
      renderPins();
    }
    if (ev.tipo === "estado_bloqueo_sistema") {
      sistemaBloqueado = (ev.detalle === "BLOQUEADO");
      saveState();
      renderSecurity();
    }
    if (ev.tipo === "estado_bloqueo_box" && boxNum >= 1 && boxNum <= 6) {
      boxBloqueado[boxNum] = (ev.detalle === "BLOQUEADO");
      saveState();
      renderSecurity();
    }

    const isErr = ev.tipo.startsWith("denegado");
    const isOk = ev.tipo === "entrada" || ev.tipo === "salida" || ev.tipo.includes("abre") || ev.tipo === "online";
    const destLog = boxNum ? `(${boxNum === 6 ? "Gimnàs" : "Box " + boxNum})` : "";
    logs.unshift({
      hora: horaFull,
      texto: `${ev.tipo} ${destLog} — ${pinStr}`,
      cls: isErr ? "err" : (isOk ? "ok" : "")
    });
    if (logs.length > 40) logs.pop();
    localStorage.setItem("pwa_logs", JSON.stringify(logs));
    renderLogs();
  }

  function genRandomPin() {
    let pin;
    do { pin = String(Math.floor(1000 + Math.random() * 9000)); }
    while (accesos.some(a => String(a.pin) === pin));
    document.getElementById("inpPin").value = pin;
  }

  function isBoxOcupado(boxNum) {
    if (boxNum < 1 || boxNum > 6) return false;
    const ahoraSec = Math.floor(Date.now() / 1000);
    const hoyBit = 1 << (new Date().getDay());
    return accesos.some(a => a.box === boxNum && (a.diasMask ? ((a.diasMask & hoyBit) !== 0) : (ahoraSec <= a.fin)));
  }

  function crearAcceso() {
    const box = parseInt(document.getElementById("selBox").value, 10);
    const durVal = document.getElementById("selDuration").value;
    const nota = document.getElementById("inpNote").value.trim();
    const pin = document.getElementById("inpPin").value.trim();

    if (!/^\d{4,10}$/.test(pin)) { showToast("PIN / Clauer: 4-10 dígits"); return; }

    let diasMask = 0;
    let mins = 1440;
    if (durVal === "weekly") {
      if (selectedDaysMask === 0) { showToast(I18N[lang].errNoDays); return; }
      diasMask = selectedDaysMask;
      mins = 5256000;
    } else {
      mins = parseInt(durVal, 10);
    }

    if (box >= 1 && isBoxOcupado(box)) {
      if (!confirm(I18N[lang].confirmBusyBox(getDestinoNombre(box)))) return;
    }

    const ahoraSec = Math.floor(Date.now() / 1000);
    const duracionSec = mins * 60;
    const finInicialSec = (diasMask > 0) ? (ahoraSec + 315360000) : ((box >= 1) ? (ahoraSec + 7 * 86400) : (ahoraSec + duracionSec));

    accesos = accesos.filter(a => String(a.pin) !== pin);
    accesos.unshift({
      pin, box, inicio: ahoraSec - 60, fin: finInicialSec, duracion: duracionSec,
      usado: false, diasMask, dentro: false, horaEntrada: "", horaSalida: "", tsEntrada: 0, nota
    });

    document.getElementById("inpNote").value = "";
    genRandomPin();
    saveState();
    renderPins();
    syncListaConESP32();
  }

  function revocarPin(pin) {
    if (!confirm(I18N[lang].confirmRevoke)) return;
    accesos = accesos.filter(a => String(a.pin) !== String(pin));
    saveState();
    renderPins();
    syncListaConESP32();
  }

  function syncListaConESP32() {
    const payloadLista = accesos.map(a => ({
      pin: String(a.pin), box: a.box, inicio: a.inicio, fin: a.fin,
      duracion: a.duracion || (a.fin - a.inicio), usado: a.usado,
      diasMask: a.diasMask || 0, dentro: Boolean(a.dentro), ultMov: a.tsEntrada || 0
    }));
    publicarEstadoNube();
    if (publishCmd({ cmd: "sync_codigos", lista: payloadLista })) showToast(I18N[lang].toastSynced);
  }

  function enviarWhatsApp(pin) {
    const acc = accesos.find(a => String(a.pin) === String(pin));
    if (!acc || acc.box === 0) return;
    const destClean = acc.box === 6 ? (lang === "ca" ? "el Gimnàs" : "el Gimnasio") : `el Box ${acc.box}`;
    let text = "";
    if (acc.diasMask > 0) {
      text = I18N[lang].waMsgWeekly(destClean, acc.pin, formatearDiasMask(acc.diasMask, true));
    } else {
      text = I18N[lang].waMsg(destClean, acc.pin, formatearDuracion(acc.duracion || (acc.fin - acc.inicio)));
    }
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  }

    const t = I18N[lang];

    for (let i = 1; i <= 6; i++) {
      html += `<option value="${i}">${getDestinoNombre(i)} (${isBoxOcupado(i) ? t.selBusy : t.selFree})</option>`;

  function renderSecurity() {
    const t = I18N[lang];
    const sysBadge = document.getElementById("sysLockBadge");
    const btnSys = document.getElementById("btnSysLock");
    sysBadge.textContent = sistemaBloqueado ? t.sysLocked : t.sysActive;
    sysBadge.className = "badge " + (sistemaBloqueado ? "badge-lock" : "badge-ok");
    btnSys.textContent = sistemaBloqueado ? t.btnUnlockAll : t.btnLockAll;
    btnSys.className = sistemaBloqueado ? "btn-warning" : "btn-danger";

    const grid = document.getElementById("boxesGrid");
    grid.innerHTML = "";
    for (let i = 1; i <= 6; i++) {
      const locked = boxBloqueado[i];
      const ocupado = isBoxOcupado(i);
      const st = boxStats[i] || null;
      const usuarioDentro = accesos.find(a => a.box === i && a.dentro) || (st && st.dentro ? st : null);

      const div = document.createElement("div");
      div.className = "box-item" + (locked ? " locked" : (usuarioDentro ? " inside" : (ocupado ? " occupied" : "")));

      const badgeClass = locked ? "badge-lock" : (usuarioDentro ? "badge-ok" : (ocupado ? "badge-pend" : "badge-ok"));
      const badgeText = locked ? "LOCK" : (usuarioDentro ? t.boxInside : (ocupado ? t.boxBusy : t.boxFree));
      const openBtnClass = ocupado ? "btn-occupied" : "btn-primary";
      const tituloCard = i === 6 ? t.gymName : `Box ${i}`;

      let infoHtml = `<div style="text-align:center; opacity:0.65;">${t.noActivityBox}</div>`;
      if (st && st.pin) {
        const nomTxt = st.nombre ? ` · ${st.nombre}` : "";
        infoHtml = `
          <div class="box-info-pin">🔑 ${st.pin}${nomTxt}</div>
          <div class="box-info-times">
            <span class="time-in">🟢 E: ${st.entrada || "—"}</span>
            <span class="time-out">🔵 S: ${st.salida || "—"}</span>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="box-head">
          <span>${tituloCard}</span>
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="box-info">${infoHtml}</div>
        <div class="box-actions">
          <button class="${openBtnClass} btn-sm" onclick="cmdAbrirBox(${i})">🚪 ${t.openBox}</button>
          <button class="${locked ? "btn-warning" : "btn-ghost"} btn-sm" onclick="toggleBoxLock(${i})">
            ${locked ? "🔓 " + t.unlockBox : "🔒 " + t.lockBox}
          </button>
        </div>
      `;
      grid.appendChild(div);
    }
    actualizarSelectorBoxes();
  }

  function renderIOLogs() {
    const t = I18N[lang];
    const list = document.getElementById("ioList");
    if (ioLogs.length === 0) {
      list.innerHTML = `<div style="color:var(--muted); font-size:0.84rem; text-align:center; padding:14px 0;">${t.noIO}</div>`;
      return;
    }
    list.innerHTML = ioLogs.map(item => {
      const isOut = item.tipo === "salida";
      const badge = isOut
        ? `<span class="badge badge-exit">🔵 ${t.exitWord}</span>`
        : `<span class="badge badge-ok">🟢 ${t.entryWord}</span>`;
      const est = item.estancia ? ` · ${t.stayWord}: <strong>${item.estancia}</strong>` : "";
      return `
        <div class="io-row ${isOut ? "out" : ""}">
          <div class="io-main">
            <div class="io-title">${item.nombre}</div>
            <div class="io-sub">${getDestinoNombre(item.box)}${est}</div>
          </div>
          <div class="io-right">
            ${badge}
            <div class="io-time">${item.hora}</div>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderPins() {
    const t = I18N[lang];
    const list = document.getElementById("pinsList");
    if (accesos.length === 0) {
      list.innerHTML = `<div style="color:var(--muted); font-size:0.85rem; text-align:center; padding:14px 0;">${t.noPins}</div>`;
      renderSecurity();
      return;
    }

    const ahoraSec = Math.floor(Date.now() / 1000);
    list.innerHTML = accesos.map(a => {
      const esClauer = (a.box === 0);
      const esSemanal = (a.diasMask && a.diasMask > 0);
      const durSeg = a.duracion || (a.fin - a.inicio);
      const esPermanent = !esSemanal && durSeg > (365 * 86400);
      const caducado = !esSemanal && (ahoraSec > a.fin);
      const finStr = new Date(a.fin * 1000).toLocaleString(lang === "ca" ? "ca-ES" : "es-ES", {
        day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
      });

      let badgeHtml = `<span class="badge badge-pend">${t.statusPending}</span>`;
      if (a.dentro) badgeHtml = `<span class="badge badge-ok">${t.insideLabel}</span>`;
      else if (esSemanal) badgeHtml = `<span class="badge badge-week">📅 ${t.weeklyBadge}</span>`;
      else if (caducado) badgeHtml = `<span class="badge badge-lock">${t.statusExpired}</span>`;
      else if (esClauer || esPermanent) badgeHtml = `<span class="badge badge-ok">${t.keyfobBadge}</span>`;
      else if (a.usado) badgeHtml = `<span class="badge badge-ok">${t.statusUsed}</span>`;

      let validezDisplay = "";
      if (esSemanal) validezDisplay = t.weeklyText(formatearDiasMask(a.diasMask, false));
      else if (esPermanent) validezDisplay = t.permanentText;
      else if (!esClauer && !a.usado && !caducado) validezDisplay = t.startsOnFirstUse(formatearDuracion(durSeg));
      else validezDisplay = `${t.validUntil}: <strong>${finStr}</strong>`;

      return `
        <div class="pin-card" style="${caducado ? "opacity:0.6;" : ""}">
          <div class="pin-top">
            <div>
              <span class="pin-code">${esClauer ? "🏷️ " + a.pin : a.pin + "#"}</span>
              <span style="font-weight:700; color:${esClauer ? "#6ee7b7" : "#93c5fd"}; margin-left:8px;">${getDestinoNombre(a.box)}</span>
            </div>
            ${badgeHtml}
          </div>
          <div class="pin-meta">${a.nota ? `<strong>${a.nota}</strong> · ` : ""}${validezDisplay}</div>
          <div class="pin-actions">
            ${!esClauer ? `<button class="btn-wa btn-sm" onclick="enviarWhatsApp('${a.pin}')">📲 ${t.btnWhatsApp}</button>` : ""}
            <button class="btn-ghost btn-sm" style="color:#fca5a5;" onclick="revocarPin('${a.pin}')">🗑 ${t.btnRevoke}</button>
          </div>
        </div>
      `;
    }).join("");
    renderSecurity();
  }

  function renderLogs() {
    const list = document.getElementById("logList");
    list.innerHTML = logs.map(l => `
      <div class="log-row ${l.cls}">
        <span>${l.texto}</span>
        <span style="color:var(--muted); white-space:nowrap;">${l.hora}</span>
      </div>
    `).join("");
  }

  function clearLogs() {
    if (currentLogTab === "io") {
      ioLogs = [];
      boxStats = {};
      localStorage.setItem("pwa_io_logs", "[]");
      localStorage.setItem("pwa_box_stats", "{}");
      renderIOLogs();
      renderSecurity();
      publicarEstadoNube();
    } else {
      logs = [];
      localStorage.setItem("pwa_logs", "[]");
      renderLogs();
    }
  }

  function setLang(newLang) {
    lang = newLang;
    localStorage.setItem("pwa_lang", lang);
    document.getElementById("btnCa").classList.toggle("active", lang === "ca");
    document.getElementById("btnEs").classList.toggle("active", lang === "es");
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (I18N[lang][key]) el.textContent = I18N[lang][key];
    });
    if (client && client.connected) document.getElementById("connText").textContent = I18N[lang].connected;
    renderDaysPicker();
    renderSecurity();
    renderPins();
    renderIOLogs();
  }

  function saveState() {
    localStorage.setItem("pwa_accesos", JSON.stringify(accesos));
    localStorage.setItem("pwa_sys_lock", JSON.stringify(sistemaBloqueado));
    localStorage.setItem("pwa_box_lock", JSON.stringify(boxBloqueado));
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2400);
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  genRandomPin();
  renderDaysPicker();
  setLang(lang);
  renderLogs();
  setInterval(() => { renderPins(); }, 30000);
  initMQTT();
</script>
</body>
</html>
